<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Tags</title>
</head>

<body>

    <header>
        <div id="logo-container">
            <img src="https://html-homework-assets.vercel.app/logo.svg" alt="Logo">
        </div>

        <nav>
            <a href="#">Courses</a>
            <a href="#">Pricing</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <main>
        <h1>Get Schooled</h1>

        <div id="hero-text">
            <span>SMILES</span>
            <span>GRIN</span>
            <span>LAUGH</span>
        </div>

        <button>REGISTER FOR FREE</button>
    </main>

    <section id="testimonial">
        <img src="https://html-homework-assets.vercel.app/testimonial.jpg" alt="testimonial image">
        <div id="quote">
            <blockquote>
                "Those tutorials are concise and go straight to the point. I can't think of a better place to learn
                smiling. And it's so fun!"
            </blockquote>

            <div id="author">
                <h3>Person Name</h3>
                <i>weather presenter</i>
            </div>
        </div>
    </section>

    <footer>
        <div>
            <img src="https://html-homework-assets.vercel.app/logo.svg" alt="logo">
            <img src="https://html-homework-assets.vercel.app/social_icons.svg" alt="social icons">
        </div>
        <span>&copy;Mellow 2026 | Made with <span class="fries">🍟</span> and Care by <a
                href="https://github.com/ndizeyedavid" target="_blank">David</a> </span>
    </footer>

</body>

</html>
