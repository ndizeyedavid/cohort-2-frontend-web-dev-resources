<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>

<body>
    <h2>Yummy Registration Form</h2>
    <form action="#">
        <label for="name">Name: </label>
        <input type="text" placeholder="Enter your Name..." id="name">

        <br><br>

        <label for="email">Email: </label>
        <input type="email" placeholder="Enter your email..." id="email">

        <br><br>

        <label for="uname">Username: </label>
        <input type="text" placeholder="Enter your prefered username..." id="uname">

        <br><br>

        <label for="gender">Gender: </label>
        <select name="gender" id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <br><br>

        <label for="pswd">Password: </label>
        <input type="password" placeholder="Enter your password..." id="pswd">

        <br><br>

        <label for="address">Address: </label>
        <input type="text" placeholder="Enter your address..." id="address">

        <br><br>

        <label for="phone">Phone: </label>
        <input type="tel" placeholder="Enter your phone number..." id="phone">

        <br><br>

        <label for="dob">Date of Birth: </label>
        <input type="date" id="dob">

        <br><br>

        <input type="button" name="submit" value="Register" onclick="handleForm()">
    </form>
</body>

</html>
