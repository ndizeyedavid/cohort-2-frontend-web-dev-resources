<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-card">
        <header class="form-header">
            <h1>Create Your Account</h1>
            <p>Fill in your details to get started with Yummy.</p>
        </header>

        <form action="#" class="registration-form" novalidate>
            <div class="form-grid">
                <div class="form-field">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name">
                </div>

                <div class="form-field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email">
                </div>

                <div class="form-field">
                    <label for="uname">Username</label>
                    <input type="text" id="uname" name="uname" placeholder="@janedoe" autocomplete="username">
                </div>

                <div class="form-field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="">Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="pswd">Password</label>
                    <input type="password" id="pswd" name="pswd" placeholder="At least 8 characters"
                        autocomplete="new-password">
                </div>

                <div class="form-field">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="KG 123 Kigali">
                </div>

                <div class="form-field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+250 788 123 456" autocomplete="tel">
                </div>

                <div class="form-field">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-primary" onclick="handleForm()">Create Account</button>
            </div>
        </form>
    </div>
    <script src="main.js"></script>
</body>

</html>
